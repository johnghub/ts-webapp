<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI SPA</title>
    <link rel="stylesheet" href="./src/common/style/navbar.css" />
    <link rel="stylesheet" href="./src/common/style/styles.css" />
    <link rel="stylesheet" href="./src/common/style/loginmodal.css" />
    <link rel="stylesheet" href="./src/common/style/bargraph.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.js"
      defer
    ></script>
  </head>
  <body>
    <login-dialog id="loginDialog" class="modal"></login-dialog>
    <filter-modal id="WeatherPageFilterDialog"></filter-modal>
    <weather-page-edit-dialog></weather-page-edit-dialog>
    <auth-state-service></auth-state-service>
    <nav-bar class="nav">
      <app-router>
        <align-container alignment="left">
          <route-element
            id="homeroute"
            path="/"
            component="HomePage"
          ></route-element>
          <route-element
            id="productsroute"
            path="/products"
            component="ProductsPage"
          >
            <route-element
              id="skiingroute"
              path="/skiing"
              component="SkiingPage"
            ></route-element>
            <route-element
              id="skatingroute"
              path="/skating"
              component="SkatingPage"
            ></route-element>
            <route-element
              id="swimsuiteroute"
              path="/swimsuit"
              component="SwimSuitPage"
            ></route-element>
          </route-element>
          <route-element
            id="aboutroute"
            path="/about"
            component="AboutPage"
          ></route-element>
          <route-element
            id="contactroute"
            path="/contact"
            component="ContactPage"
          ></route-element>
          <route-element
            id="weatherroute"
            path="/weather"
            component="WeatherPage"
          ></route-element>
          <route-element
            id="bargraphroute"
            path="/bargraph"
            component="BarGraphPage"
          ></route-element>
          <!-- <route-element
            id="userroute"
            path="/user"
            component="UserPage"
            data-auth-visible="authenticated"
          ></route-element> -->
          <route-element
            id="adminroute"
            path="/admin"
            component="AdminPage"
            data-auth-visible="authenticated"
          ></route-element>
          <route-element
            id="authweatherroute"
            path="/authweather"
            component="AuthWeatherPage"
            data-auth-visible="authenticated"
          ></route-element>
        </align-container>
        <align-container alignment="right">
          <route-element
            id="LoginRegisterMenu"
            path="/Login&#47;Register"
            component="LoginRegisterPage"
            data-align="right"
            data-auth-visible="anonymous"
          >
            <route-element
              id="LoginAction"
              path="/login"
              component="LoginPage"
              data-action="open-login-dialog"
            ></route-element>
            <!-- <route-element
              id="Register"
              path="/register"
              component="RegisterPage"
              data-action="register-user"
            ></route-element> -->
          </route-element>
          <route-element
            id="ProfileMenu"
            path="/Profile"
            component="fooPage"
            data-align="right"
            data-auth-visible="authenticated"
          >
            <route-element
              id="logoutroute"
              path="/logout"
              component="LogoutPage"
              data-auth-visible="authenticated"
            ></route-element>
            <route-element
              id="profileroute"
              path="/profile"
              component="UserPage"
              data-auth-visible="authenticated"
            ></route-element>
          </route-element>
        </align-container>
      </app-router>
    </nav-bar>

    <page-area class="main-content"> </page-area>
    <site-footer class="footer"></site-footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
